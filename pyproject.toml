[project]
name = "devpipe"
version = "0.2.0"
description = "要件 → 要件定義 → 設計 → テスト先行 → 実装 → 検証 を Claude Agent SDK で繋ぐパイプライン"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["claude-agent-sdk>=0.2.159,<0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devpipe = "pipe_in.cli:main"
devpipe-gen = "pipe_in_generator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# エンジン（devpipe/）と、ジェネレーター（generator/ を devpipe_generator という名前で入れる）
packages = ["pipe_in", "pipe_in.engine", "pipe_in.usage", "pipe_in.dev", "pipe_in.pipe", "pipe_in_generator"]
package-dir = { "pipe_in_generator" = "generator" }

[tool.setuptools.package-data]
"pipe_in.dev" = ["prompts/*.md"]
"pipe_in.pipe" = ["*.md"]
"pipe_in_generator" = ["*.md", "templates/*/*.toml", "templates/*/*.md", "templates/*/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
