[project]
name = "devpipe"
version = "0.2.0"
description = "要件 → 要件定義 → 設計 → テスト先行 → 実装 → 検証 を Claude Agent SDK で繋ぐパイプライン"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["claude-agent-sdk>=0.2.159,<0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devpipe = "devpipe.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["devpipe", "devpipe.prompts"]

[tool.setuptools.package-data]
"devpipe.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
