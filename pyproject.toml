[project]
name = "devpipe"
version = "0.2.0"
description = "要件 → 要件定義 → 設計 → テスト先行 → 実装 → 検証 を Claude Agent SDK で繋ぐパイプライン"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["claude-agent-sdk>=0.2.159,<0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devpipe = "devpipe.cli:main"
devpipe-gen = "devpipe_generator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# エンジン（devpipe/）と、ジェネレーター（generator/ を devpipe_generator という名前で入れる）
packages = ["devpipe", "devpipe.engine", "devpipe.usage", "devpipe.dev", "devpipe.pipe", "devpipe_generator"]
package-dir = { "devpipe_generator" = "generator" }

[tool.setuptools.package-data]
"devpipe.dev" = ["prompts/*.md"]
"devpipe.pipe" = ["*.md"]
"devpipe_generator" = ["templates/*/*.toml", "templates/*/*.md", "templates/*/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
