<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>S4 計画ボード</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
body{margin:0}
a{color:#167d6b}a:hover{color:#0f5a4d}
</style>
</helmet>
<div style="width: 2720px; height: 1150px; box-sizing: border-box; padding: 40px; background: #e9e8e4; color: #23201e; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; gap: 20px;">
  <header style="display: flex; align-items: baseline; gap: 16px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .08em; color: #6b625c;">PIPE-IN · SCREENS · S4</span>
    <h1 style="margin: 0; font-size: 28px; font-weight: 900;">計画ボード（/pipe-plan）</h1>
    <span style="font-size: 14px; color: #4f4741;">上から：いま動いているセッション → 段階ごとの進み具合 → 道具 → 状態ごとの列。</span>
  </header>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; flex-grow: 1;">
    <sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
      <div style="background: {{t.bg}}; color: {{t.fg}}; border: 1px solid {{t.line}}; border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="width: 18px; height: 18px; border-radius: 6px; background: {{t.coral}};" aria-hidden="true"></span>
          <h2 style="margin: 0; font-size: 22px; font-weight: 900;">計画ボード</h2>
          <span style="font-size: 12px; color: {{t.muted}};">できたこと・まだのこと・やりたいこと</span>
          <span style="flex-grow: 1;"></span>
          <span style="font-size: 12px; color: {{t.muted}}; font-family: 'JetBrains Mono', monospace;">53 件</span>
          <kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 0 5px; border: 1px solid {{t.line}}; border-bottom-width: 2px; border-radius: 4px; background: {{t.panel}};">N</kbd><span style="font-size: 12px; color: {{t.muted}};">足す</span>
        </div>

        <section style="background: {{t.panel}}; border: 1px solid {{t.line}}; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <strong style="font-size: 14px;">いま動いているセッション</strong>
            <span style="font-size: 11px; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: {{t.coralSoft}}; color: {{t.coralText}};">▲ あなた待ち 1</span>
            <span style="font-size: 11px; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: {{t.tealSoft}}; color: {{t.tealText}};">● 作業中 1</span>
            <span style="flex-grow: 1;"></span>
            <span style="font-size: 11px; color: {{t.muted}}; font-family: 'JetBrains Mono', monospace;">12:40 時点</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
            <sc-for list="{{t.sessions}}" as="s">
              <article style="border-radius: 10px; padding: 9px 10px; background: {{s.bg}}; border: {{s.border}}; display: flex; flex-direction: column; gap: 4px; min-width: 0;">
                <div style="display: flex; gap: 6px; align-items: baseline;"><span style="flex-grow: 1; font-size: 12px; font-weight: 700;">{{s.title}}</span><span style="font-size: 10px; font-weight: 700; padding: 0 7px; border-radius: 999px; background: {{s.pillBg}}; color: {{s.pillFg}}; white-space: nowrap;">{{s.pill}}</span></div>
                <span style="font-size: 11px; color: {{s.detailColor}};">{{s.detail}}</span>
                <div style="display: flex; gap: 8px; font-size: 11px;"><span style="flex-grow: 1; color: {{t.muted}};">{{s.when}}</span><a href="#" style="color: {{t.teal}};">開く</a></div>
              </article>
            </sc-for>
          </div>
        </section>

        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{t.stages}}" as="g">
            <button type="button" aria-pressed="{{g.on}}" style="font: inherit; color: {{t.fg}}; text-align: left; border-radius: 12px; padding: 8px 10px; background: {{g.bg}}; border: {{g.border}}; display: flex; flex-direction: column; gap: 6px; min-width: 0;">
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 4px;"><span style="font-size: 13px; font-weight: 700;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: {{t.muted}}; margin-right: 4px;">{{g.n}}</span>{{g.name}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{t.muted}};">{{g.frac}}</span></div>
              <div style="display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: {{t.col}};"><span style="width: {{g.done}}; background: {{t.ok}};"></span><span style="width: {{g.check}}; background: {{t.coral}};"></span></div>
            </button>
          </sc-for>
        </div>

        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="search" aria-label="さがす" placeholder="名前・メモ・#番号・D番号でさがす" style="font: inherit; font-size: 13px; flex-grow: 1; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.panel}}; color: {{t.fg}};">
          <button type="button" style="font: inherit; font-size: 12px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.fg}}; background: {{t.fg}}; color: {{t.bg}}; font-weight: 700;">すべて</button>
          <button type="button" style="font: inherit; font-size: 12px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.panel}}; color: {{t.muted}};">機能</button>
          <button type="button" style="font: inherit; font-size: 12px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.panel}}; color: {{t.muted}};">直す</button>
          <button type="button" style="font: inherit; font-size: 14px; font-weight: 700; height: 34px; padding: 0 16px; border-radius: 8px; border: none; background: {{t.coral}}; color: {{t.onCoral}};">＋ 足す</button>
        </div>

        <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: start;">
          <sc-for list="{{t.cols}}" as="c">
            <section style="background: {{t.col}}; border-radius: 14px; padding: 9px; display: flex; flex-direction: column; gap: 7px; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.dot}};"></span>{{c.name}}<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; color: {{t.muted}}; font-weight: 400;">{{c.count}}</span></div>
              <sc-for list="{{c.cards}}" as="k">
                <article style="background: {{t.card}}; border-radius: 10px; padding: 8px 9px; box-shadow: {{t.shadow}}; outline: {{k.outline}}; display: flex; flex-direction: column; gap: 5px;">
                  <div style="display: flex; gap: 6px;"><span style="flex-grow: 1; font-size: 12px; font-weight: 500;">{{k.title}}</span><sc-if value="{{k.high}}" hint-placeholder-val="{{false}}"><span aria-label="優先 高" style="display: inline-flex; gap: 2px; padding-top: 3px;"><span style="width: 3px; height: 9px; border-radius: 1px; background: {{t.coral}};"></span><span style="width: 3px; height: 9px; border-radius: 1px; background: {{t.coral}};"></span><span style="width: 3px; height: 9px; border-radius: 1px; background: {{t.coral}};"></span></span></sc-if></div>
                  <div style="display: flex; flex-wrap: wrap; gap: 3px;"><span style="font-size: 10px; padding: 0 6px; border-radius: 5px; background: {{t.col}}; color: {{t.muted}};">{{k.stage}}</span><span style="font-size: 10px; padding: 0 6px; border-radius: 5px; background: {{t.col}}; color: {{t.muted}}; font-family: 'JetBrains Mono', monospace;">{{k.ref}}</span></div>
                </article>
              </sc-for>
            </section>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2720,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const L = { bg: "#f6f6f4", panel: "#ffffff", card: "#ffffff", col: "#ecebe7", line: "#e4ded8", fg: "#23201e", muted: "#6b625c",
      coral: "#c2471f", onCoral: "#ffffff", coralSoft: "#fde6dd", coralText: "#a83a17", teal: "#167d6b", tealSoft: "#dcefe9", tealText: "#0f5a4d",
      ok: "#2e7d32", idea: "#8f857e", quiet: "#ecebe7", quietText: "#5b534d", shadow: "0 1px 2px rgba(35,32,30,.08)" };
    const D = { bg: "#161514", panel: "#211f1d", card: "#26231f", col: "#1d1b19", line: "#36322f", fg: "#f2ece6", muted: "#ada39b",
      coral: "#ff8a65", onCoral: "#2a140b", coralSoft: "#4a2316", coralText: "#ffb59c", teal: "#5fc4ab", tealSoft: "#15392f", tealText: "#8fe0c6",
      ok: "#81c784", idea: "#8a8079", quiet: "#2c2926", quietText: "#c4bab2", shadow: "0 1px 2px rgba(0,0,0,.45)" };
    const build = (t) => {
      const k = (title, stage, ref, o) => Object.assign({ title, stage, ref, high: false, outline: "none" }, o || {});
      return Object.assign({}, t, {
        sessions: [
          { title: "CSV 出力を足す", pill: "▲ あなた待ち", pillBg: t.panel, pillFg: t.coralText, bg: t.coralSoft, border: "1px solid " + t.coral, detail: "要ること：要件定義を読んで承認か修正の依頼を", detailColor: t.coralText, when: "更新 12分前" },
          { title: "ログインの不具合を直す", pill: "● 作業中", pillBg: t.tealSoft, pillFg: t.tealText, bg: t.panel, border: "1px solid " + t.line, detail: "実装の段を進めている", detailColor: t.muted, when: "更新 たった今" },
          { title: "設計図をそろえる", pill: "一区切り", pillBg: t.quiet, pillFg: t.quietText, bg: t.panel, border: "1px solid " + t.line, detail: "合格で終わった", detailColor: t.muted, when: "更新 10時間前" },
        ],
        stages: [
          { n: "0", name: "足場", frac: "4/10", done: "40%", check: "0%", on: "false", bg: t.panel, border: "1px solid " + t.line },
          { n: "1", name: "見る", frac: "4/11", done: "36%", check: "36%", on: "true", bg: t.tealSoft, border: "2px solid " + t.teal },
          { n: "2", name: "組む", frac: "0/3", done: "0%", check: "0%", on: "false", bg: t.panel, border: "1px solid " + t.line },
          { n: "3", name: "口を出す", frac: "0/4", done: "0%", check: "0%", on: "false", bg: t.panel, border: "1px solid " + t.line },
          { n: "4", name: "一般の人へ", frac: "0/5", done: "0%", check: "0%", on: "false", bg: t.panel, border: "1px solid " + t.line },
          { n: "—", name: "段階の外", frac: "6/20", done: "30%", check: "45%", on: "false", bg: t.panel, border: "1px solid " + t.line },
        ],
        cols: [
          { name: "アイデア", dot: t.idea, count: "0", cards: [] },
          { name: "やる予定", dot: t.fg, count: "5", cards: [ k("確認待ちになったら通知する", "段階1", "#14"), k("並列の枠を実行の図に出す", "段階1", "#13"), k("段ごとの費用を上限と比べる", "段階1", "#42") ] },
          { name: "進行中", dot: t.teal, count: "1", cards: [ k("計画ボード /pipe-plan", "段階外", "D0029", { outline: "2px solid " + t.teal }) ] },
          { name: "手で確かめる", dot: t.coral, count: "4", cards: [ k("差し戻しの理由を図で見る", "段階1", "D0016"), k("動いている様子と時間", "段階1", "D0017"), k("「⚠ 更新なし」の印", "段階1", "D0021", { high: true }) ] },
          { name: "完了", dot: t.ok, count: "2", cards: [ k("実行の一覧と Web アプリの形", "段階1", "D0019"), k("成果物のタブ", "段階1", "D0025") ] },
        ],
      });
    };
    return { themes: [build(L), build(D)] };
  }
}
</script>
</body>
</html>
