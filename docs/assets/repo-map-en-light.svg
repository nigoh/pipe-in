<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">pipe-in repository map</title>
  <desc id="desc">Repository map. Four parts: App (pipe_in/, vscode/, pipes/), Build (new, design, check, list of generator/), Plugin (plugin/ and the helper tools in generator/), and Dev (.claude/, docs/development/, docs/decisions/), with three kinds of arrows: import, runs a command, reads only. The list below has the main points</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6b625c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="860" fill="#f6f6f4"/>
