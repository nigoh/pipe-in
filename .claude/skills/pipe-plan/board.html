<title>pipe-in 計画ボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 色はブランド「プラグ」（docs/design/README.md）。コーラル＝人が手を出す、ティール＝流れている・選んでいる。
   状態は色だけでなく、アイコンの形と言葉でも伝える。 */
:root {
  --bg: #f6f6f4; --panel: #ffffff; --panel-2: #ecebe7; --line: #e4ded8; --fg: #23201e; --muted: #6b625c;
  --coral: #c2471f; --coral-soft: #fde6dd; --coral-text: #a83a17; --on-coral: #ffffff;
  --teal: #167d6b; --teal-soft: #dcefe9; --teal-text: #0f5a4d;
  --blue: #3f6fb0; --blue-soft: #e1eaf7; --blue-text: #2c5590;
  --bad: #b3261e; --bad-soft: #fbe2df; --bad-text: #9a1f18;
  --ok: #2e7d32; --ok-soft: #e3f1e3; --ok-text: #22652a;
  --quiet: #ecebe7; --quiet-text: #5b534d; --idea: #8f857e;
  --shadow: 0 1px 2px rgba(35, 32, 30, .08); --shadow-lift: 0 8px 24px rgba(35, 32, 30, .18);
  --toast-bg: #23201e; --toast-fg: #f6f6f4;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --panel: #211f1d; --panel-2: #1d1b19; --line: #36322f; --fg: #f2ece6; --muted: #ada39b;
    --coral: #ff8a65; --coral-soft: #4a2316; --coral-text: #ffb59c; --on-coral: #2a140b;
    --teal: #5fc4ab; --teal-soft: #15392f; --teal-text: #8fe0c6;
    --blue: #8db4ee; --blue-soft: #1c2b45; --blue-text: #b3cdf5;
    --bad: #ff8a80; --bad-soft: #4a1f1c; --bad-text: #ffb4ab;
    --ok: #81c784; --ok-soft: #1e3a20; --ok-text: #a5d6a7;
    --quiet: #2c2926; --quiet-text: #c4bab2; --idea: #8a8079;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45); --shadow-lift: 0 8px 24px rgba(0, 0, 0, .55);
    --toast-bg: #f2ece6; --toast-fg: #161514;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161514; --panel: #211f1d; --panel-2: #1d1b19; --line: #36322f; --fg: #f2ece6; --muted: #ada39b;
  --coral: #ff8a65; --coral-soft: #4a2316; --coral-text: #ffb59c; --on-coral: #2a140b;
  --teal: #5fc4ab; --teal-soft: #15392f; --teal-text: #8fe0c6;
  --blue: #8db4ee; --blue-soft: #1c2b45; --blue-text: #b3cdf5;
  --bad: #ff8a80; --bad-soft: #4a1f1c; --bad-text: #ffb4ab;
  --ok: #81c784; --ok-soft: #1e3a20; --ok-text: #a5d6a7;
  --quiet: #2c2926; --quiet-text: #c4bab2; --idea: #8a8079;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45); --shadow-lift: 0 8px 24px rgba(0, 0, 0, .55);
  --toast-bg: #f2ece6; --toast-fg: #161514;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1400px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: .02em; text-wrap: balance; }
h1 { display: flex; align-items: center; gap: 10px; }
h1 .logo { width: 18px; height: 18px; border-radius: 6px; background: var(--coral); flex: none; }
h1 .tag { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-weight: 600; }
.lede { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
.sync { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.sync.err { color: var(--bad); }
.keys { font-size: 12px; color: var(--muted); }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }

/* いま動いているセッション */
.live { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.live-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.live-head h2 { margin: 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.live-head .stamp { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.live-head .spacer { flex: 1; }
.live-sum { display: flex; flex-wrap: wrap; gap: 6px; }
.live-msg { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.live-msg.err { color: var(--bad); }
.sessions { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.sess {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; display: grid; gap: 5px; min-width: 0;
  background: var(--panel);
}
.sess.b-blocked { border-color: var(--coral); background: var(--coral-soft); }
.sess.b-failed { border-color: var(--bad); }
.sess .row1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.sess .title { font-weight: 700; font-size: 13px; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.sess .detail { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.sess .detail.need { color: var(--coral-text); font-weight: 500; }
.sess .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.sess .foot a { color: var(--teal); }
.sess .foot .grow { flex: 1; }
/* 状態の札：形（アイコン）＋言葉＋色 */
.state { font-size: 11px; padding: 1px 9px; border-radius: 999px; white-space: nowrap; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.state .ic { width: 12px; height: 12px; flex: none; }
.state.b-blocked { background: var(--coral-soft); color: var(--coral-text); }
.sess.b-blocked .state.b-blocked { background: var(--panel); }
.state.b-working { background: var(--teal-soft); color: var(--teal-text); }
.state.b-review { background: var(--blue-soft); color: var(--blue-text); }
.state.b-failed { background: var(--bad-soft); color: var(--bad-text); }
.state.b-done { background: var(--quiet); color: var(--quiet-text); }
@media (prefers-reduced-motion: no-preference) {
  .state.b-working .ic { animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
}
.linkbtn { font: inherit; font-size: 12px; background: none; border: none; color: var(--teal); cursor: pointer; padding: 0; text-decoration: underline; }

/* 段階の帯 */
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.stage {
  text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; color: var(--fg); font: inherit; cursor: pointer; display: grid; gap: 6px; min-width: 0;
}
.stage:hover { border-color: var(--teal); }
.stage[aria-pressed="true"] { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); background: var(--teal-soft); }
.stage .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.stage .num { font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.stage .name { font-weight: 700; font-size: 14px; }
.stage .frac { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* 進み具合の棒：色だけに頼らず、模様（完了＝塗り・手で確かめる＝斜線・進行中＝点）と区切りで分ける */
.bar { display: flex; gap: 2px; height: 8px; border-radius: 3px; overflow: hidden; background: var(--panel-2); }
.bar span { display: block; height: 100%; border-radius: 2px; }
.bar .g-done { background: var(--ok); }
.bar .g-check { background: repeating-linear-gradient(135deg, var(--coral) 0 3px, var(--coral-soft) 3px 6px); }
.bar .g-doing { background: radial-gradient(var(--teal) 1.4px, var(--teal-soft) 1.6px) 0 0 / 5px 5px; }
.stage .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 道具の列 */
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools input[type="search"], select, input[type="text"], input[type="number"], textarea {
  font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 0;
}
.tools input[type="search"] { flex: 1 1 220px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); color: var(--muted); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }
.btn {
  font: inherit; font-weight: 500; padding: 6px 14px; border-radius: 8px; min-height: 34px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); cursor: pointer;
}
.btn.small { padding: 3px 10px; font-size: 12px; min-height: 28px; }
.btn.primary { background: var(--coral); color: var(--on-coral); border-color: var(--coral); font-weight: 700; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, .card:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* 列 */
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .board { grid-template-columns: minmax(0, 1fr); } }
.col { background: var(--panel-2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; min-width: 0; border: 2px dashed transparent; }
.col.drop { border-color: var(--teal); background: var(--teal-soft); }
.col h2 { margin: 0; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; letter-spacing: .03em; }
.col h2 .ic { width: 14px; height: 14px; flex: none; }
.col h2 .count { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 400; }
.col .hint { font-size: 12px; color: var(--muted); margin: -4px 0 0; }
.col .empty { font-size: 12px; color: var(--muted); padding: 10px; border: 1px dashed var(--line); border-radius: 6px; text-align: center; }
.more { font: inherit; font-size: 12px; background: none; border: none; color: var(--teal); cursor: pointer; padding: 4px; text-align: left; }

.card {
  background: var(--panel); border: 1px solid transparent; border-radius: 10px; padding: 9px 10px;
  display: grid; gap: 6px; box-shadow: var(--shadow); min-width: 0; cursor: pointer; color: var(--fg);
}
.card:hover { border-color: var(--teal); }
.card.dragging { opacity: .4; }
.card .head { display: flex; gap: 6px; align-items: flex-start; }
.card .t { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; flex: 1; min-width: 0; }
/* 優先は棒の本数で伝える（高 3・中 2・低 1） */
.prio { display: inline-flex; gap: 2px; padding-top: 4px; flex: none; }
.prio i { width: 3px; height: 10px; border-radius: 1px; background: var(--line); }
.prio.p-high i { background: var(--coral); }
.prio.p-mid i:nth-child(-n+2) { background: var(--fg); }
.prio.p-low i:first-child { background: var(--muted); }
.card .note { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .acts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.mv {
  font: inherit; font-size: 11px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--muted); cursor: pointer; min-height: 24px; white-space: nowrap;
}
.mv:hover { color: var(--teal-text); border-color: var(--teal); }
.mv.run { color: var(--coral-text); border-color: var(--coral); }
.mv:disabled { opacity: .5; cursor: not-allowed; }
.meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--quiet); color: var(--muted); white-space: nowrap; }
.pill.mono { font-family: var(--f-mono); }

/* 編集 */
dialog {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--fg);
  width: min(560px, calc(100vw - 32px)); padding: 0; box-shadow: var(--shadow-lift);
}
dialog::backdrop { background: rgba(22, 21, 20, .55); }
dialog form { display: grid; gap: 12px; padding: 18px; }
dialog h3 { margin: 0; font-size: 16px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
textarea { min-height: 90px; resize: vertical; width: 100%; }
dialog input[type="text"], dialog select { width: 100%; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.actions .right { display: flex; gap: 8px; margin-left: auto; }
.confirm { font-size: 12px; color: var(--bad); overflow-wrap: anywhere; }
.confirm a { color: var(--teal); }
.links { font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
.links a { color: var(--teal); }
.ro-note { font-size: 12px; color: var(--muted); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--toast-bg); color: var(--toast-fg); border-radius: 8px; padding: 8px 14px;
  display: flex; gap: 12px; align-items: center; font-size: 13px; box-shadow: var(--shadow-lift);
  max-width: calc(100vw - 32px); z-index: 20;
}
.toast button { font: inherit; font-size: 13px; background: none; border: none; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
@media (prefers-reduced-motion: no-preference) { .card, .stage { transition: border-color .15s; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1><span class="logo" aria-hidden="true"></span>計画ボード<span class="tag">pipe-in</span></h1>
      <p class="lede">できたこと・まだのこと・やりたいことを、段階と状態で並べます。カードは引いて別の列に移すか、下の矢印で進めます。</p>
    </div>
    <div>
      <span class="sync" id="sync">読み込み中…</span>
      <div class="keys"><kbd>N</kbd> 足す　<kbd>/</kbd> さがす　<kbd>Esc</kbd> 閉じる</div>
    </div>
  </header>

  <section class="live" aria-labelledby="live-title">
    <div class="live-head">
      <h2 id="live-title">いま動いているセッション</h2>
      <div class="live-sum" id="live-sum"></div>
      <span class="spacer"></span>
      <span class="stamp" id="live-stamp"></span>
      <div class="chips" role="group" aria-label="セッションの範囲">
        <button class="chip" type="button" id="scope-repo" aria-pressed="true">pipe-in だけ</button>
        <button class="chip" type="button" id="scope-all" aria-pressed="false">すべて</button>
      </div>
      <button class="btn small" type="button" id="live-refresh" hidden>読み直す</button>
    </div>
    <div class="live-msg" id="live-msg">セッションを読み込んでいます…</div>
    <div class="sessions" id="sessions"></div>
  </section>

  <section class="stages" id="stages" aria-label="段階ごとの進み具合"></section>

  <div class="tools">
    <input type="search" id="q" placeholder="名前・メモ・#番号・D番号でさがす" aria-label="さがす">
    <div class="chips" id="kinds" role="group" aria-label="種類でしぼる"></div>
    <button class="btn primary" id="add" type="button">＋ 足す</button>
  </div>

  <main class="board" id="board"></main>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button type="button" id="toast-undo">戻す</button></div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h3 id="dlg-title">項目</h3>
    <div class="field"><label for="f-title">名前</label><input type="text" id="f-title" required maxlength="200"></div>
    <div class="row">
      <div class="field"><label for="f-status">状態</label><select id="f-status"></select></div>
      <div class="field"><label for="f-stage">段階</label><select id="f-stage"></select></div>
      <div class="field"><label for="f-kind">種類</label><select id="f-kind"></select></div>
      <div class="field"><label for="f-priority">優先</label><select id="f-priority"></select></div>
    </div>
    <div class="row">
      <div class="field"><label for="f-issue">イシュー番号</label><input type="number" id="f-issue" min="1" step="1" placeholder="例 42"></div>
      <div class="field"><label for="f-decision">決定の記録</label><input type="text" id="f-decision" maxlength="12" placeholder="例 D0028"></div>
    </div>
    <div class="field"><label for="f-session">つないだセッション</label><select id="f-session"></select></div>
    <div class="field"><label for="f-note">メモ</label><textarea id="f-note" maxlength="4000"></textarea></div>
    <div class="links" id="f-links"></div>
    <p class="ro-note" id="ro-note" hidden>この画面では見るだけです（書き込める人だけが変えられます）。</p>
    <div class="actions">
      <button class="btn danger" type="button" id="f-del">消す</button>
      <span class="confirm" id="f-confirm" hidden>もう一度押すと消えます</span>
      <div class="right">
        <button class="btn" type="button" id="f-cancel">閉じる</button>
        <button class="btn primary" type="submit" id="f-save">保存</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="run-dlg">
  <form id="run-form" method="dialog">
    <h3>新しいセッションで /pipe-in を始める</h3>
    <div class="field"><label for="run-prompt">送る言葉（直せます。先頭は「/pipe-in 」のまま）</label><textarea id="run-prompt" maxlength="8000"></textarea></div>
    <div class="field"><label for="run-env">環境</label><select id="run-env"></select></div>
    <p class="ro-note" id="run-env-note"></p>
    <p class="ro-note">作ると Claude Code Remote に新しいセッションができ、プランの利用枠を使います（並べて作るほど減ります）。段の区切りで止まるので、続きはセッションで答えてください。</p>
    <p class="confirm" id="run-msg" hidden></p>
    <div class="actions">
      <button class="btn small" type="button" id="run-allow" hidden>許して読む</button>
      <div class="right">
        <button class="btn" type="button" id="run-cancel">やめる</button>
        <button class="btn primary" type="submit" id="run-go">作る</button>
      </div>
    </div>
  </form>
</dialog>

<script>
(() => {
  const REPO = "https://github.com/nigoh/pipe-in";
  const REPO_SLUG = "nigoh/pipe-in";
  const SESSION_SERVER = "Claude Code Remote";
  const SESSION_URL = "https://claude.ai/code/";
  // アイコンは Lucide（ISC。docs/design/LICENSE-lucide.txt）の線画をそのまま使う。
  const ICONS = {"hand": "M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15", "spin": "M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5", "eye": "M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0", "x": "M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0M15 9l-6 6M9 9l6 6", "ok": "M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0M16 9l-5.5 5.5L8 12", "bulb": "M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4", "circle": "M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0", "play": "M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996zM2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0", "clip": "M9 2h6a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-6a1 1 0 0 1 -1 -1v-2a1 1 0 0 1 1 -1ZM16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4"};
  const STATUSES = [
    { id: "idea", name: "アイデア", hint: "やりたいこと。まだ段階に入れていない", icon: "bulb", color: "--idea" },
    { id: "todo", name: "やる予定", hint: "イシューがあり、手を付けていない", icon: "circle", color: "--fg" },
    { id: "doing", name: "進行中", hint: "ブランチ・PR で作っている", icon: "play", color: "--teal" },
    { id: "check", name: "手で確かめる", hint: "作ったが、実機・手での確認がまだ", icon: "clip", color: "--coral" },
    { id: "done", name: "完了", hint: "main に入り、確認も済んだ", icon: "ok", color: "--ok" },
  ];
  const STAGES = [
    { id: "0", name: "足場", sub: "残りを片づける" },
    { id: "1", name: "見る", sub: "実行のフローチャートを充実させる" },
    { id: "2", name: "組む", sub: "作業台と Claude Code をつなぐ" },
    { id: "3", name: "口を出す", sub: "図から操作する" },
    { id: "4", name: "一般の人へ", sub: "入口を低くする" },
    { id: "x", name: "段階の外", sub: "ロードマップに入っていないもの" },
  ];
  const KINDS = [
    { id: "feature", name: "機能" }, { id: "fix", name: "直す" }, { id: "verify", name: "確かめる" },
    { id: "chore", name: "整える" }, { id: "idea", name: "思いつき" },
  ];
  const PRIOS = [{ id: "", name: "—" }, { id: "high", name: "高" }, { id: "mid", name: "中" }, { id: "low", name: "低" }];
  // セッションの状態（status_bucket）を、見る人の言葉に直す。並びは気にしてほしい順。
  const BUCKETS = {
    BLOCKED: { cls: "b-blocked", name: "待ち", icon: "hand", rank: 0 },
    WORKING: { cls: "b-working", name: "作業中", icon: "spin", rank: 1 },
    REVIEW_READY: { cls: "b-review", name: "見てほしい", icon: "eye", rank: 2 },
    FAILED: { cls: "b-failed", name: "失敗", icon: "x", rank: 3 },
    COMPLETED: { cls: "b-done", name: "一区切り", icon: "ok", rank: 4 },
  };
  const DONE_LIMIT = 8;
  const QUIET_LIMIT = 4;
  const STATUS_IDS = STATUSES.map((s) => s.id);

  let items = [];
  let sessions = [];
  let sessionsById = new Map();
  let db = null, col = null, canWrite = true;
  let filterStage = null, filterKind = null, query = "", showAllDone = false, editing = null;
  let scopeAll = false, showQuiet = false;
  let dragId = null;
  let sessionsLoaded = false, savedEnvId = "", envs = [], creating = false;
  let runItem = null, runBlocked = false, envSeq = 0;
  const justStarted = new Set();
  const uncertain = new Set();

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const SVG_NS = "http://www.w3.org/2000/svg";
  const icon = (name) => {
    const s = document.createElementNS(SVG_NS, "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", "2.2"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
    s.setAttribute("aria-hidden", "true"); s.setAttribute("class", "ic");
    const p = document.createElementNS(SVG_NS, "path"); p.setAttribute("d", ICONS[name] || ""); s.append(p);
    return s;
  };
  const stateChip = (b, text) => { const c = el("span", "state " + b.cls); c.append(icon(b.icon), document.createTextNode(text)); return c; };
  const nameOf = (list, id) => (list.find((x) => x.id === id) || {}).name || id || "";
  const prioRank = { high: 0, mid: 1, low: 2, "": 3 };

  try {
    const s = JSON.parse(localStorage.getItem("plan-filter") || "{}");
    filterStage = s.stage ?? null; filterKind = s.kind ?? null; scopeAll = !!s.scopeAll;
  } catch (e) {}
  const remember = () => { try { localStorage.setItem("plan-filter", JSON.stringify({ stage: filterStage, kind: filterKind, scopeAll })); } catch (e) {} };

  function fill(sel, list) { sel.replaceChildren(...list.map((o) => { const op = el("option", null, o.name); op.value = o.id; return op; })); }
  fill($("f-status"), STATUSES);
  fill($("f-stage"), STAGES.map((s) => ({ id: s.id, name: s.id === "x" ? s.name : `${s.id}. ${s.name}` })));
  fill($("f-kind"), KINDS);
  fill($("f-priority"), PRIOS);

  function ago(iso) {
    const t = Date.parse(iso || "");
    if (!Number.isFinite(t)) return "";
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return "たった今";
    if (m < 60) return `${m}分前`;
    const h = Math.round(m / 60);
    if (h < 24) return `${h}時間前`;
    return `${Math.round(h / 24)}日前`;
  }

  // ---- セッション ----
  function bucketOf(s) {
    const raw = String(s.status_bucket || "").replace("SESSION_STATUS_BUCKET_", "");
    return BUCKETS[raw] || BUCKETS.COMPLETED;
  }
  function touchesRepo(s) {
    const ctx = s.session_context || {};
    const urls = [...(ctx.sources || []), ...(ctx.outcomes || [])].map((x) => {
      const g = (x && x.git_repository) || {};
      return String(g.url || (g.git_info && g.git_info.repo) || "");
    });
    return urls.some((u) => u === REPO_SLUG || u.endsWith("/" + REPO_SLUG) || u.endsWith("/" + REPO_SLUG + ".git"));
  }
  function branchOf(s) {
    const cur = s.external_metadata && s.external_metadata.current_branches;
    if (cur) for (const v of Object.values(cur)) if (typeof v === "string" && v) return v;
    for (const o of ((s.session_context || {}).outcomes || [])) {
      const g = o && o.git_repository && o.git_repository.git_info;
      if (g && g.repo === REPO_SLUG && Array.isArray(g.branches) && g.branches[0]) return String(g.branches[0]);
    }
    return "";
  }
  function summaryOf(s) {
    const p = s.post_turn_summary || (s.external_metadata && s.external_metadata.post_turn_summary) || {};
    return { need: String(p.needs_action || ""), detail: String(p.status_detail || p.recent_action || "") };
  }
  // 一覧の返事は、ふつうは {ccr: {data: [...]}}。文字で来たときは JSON の部分だけを読む。
  function extractSessions(payload) {
    let p = payload;
    if (typeof p === "string") {
      const a = p.indexOf("{"), b = p.lastIndexOf("}");
      try { p = a >= 0 && b > a ? JSON.parse(p.slice(a, b + 1)) : null; } catch (e) { p = null; }
    }
    const list = (p && p.ccr && p.ccr.data) || (p && p.data) || (Array.isArray(p) ? p : null);
    return Array.isArray(list) ? list.filter((s) => s && typeof s.id === "string") : null;
  }

  function setLiveMsg(text, err, withButton) {
    const m = $("live-msg");
    m.replaceChildren();
    m.hidden = !text;
    m.classList.toggle("err", !!err);
    if (text) m.append(el("span", null, text));
    if (withButton) {
      const b = el("button", "btn small primary", withButton.label);
      b.type = "button";
      b.addEventListener("click", withButton.run);
      m.append(b);
    }
  }

  function renderSessions() {
    sessionsById = new Map(sessions.map((s) => [s.id, s]));
    for (const id of [...justStarted]) if (sessionsById.has(id)) justStarted.delete(id);
    const scoped = sessions.filter((s) => !String(s.session_status || "").includes("ARCHIVED") && (scopeAll || touchesRepo(s)));
    scoped.sort((a, b) => (bucketOf(a).rank - bucketOf(b).rank) || String(b.updated_at || "").localeCompare(String(a.updated_at || "")));
    const active = scoped.filter((s) => bucketOf(s).rank < 4);
    const quiet = scoped.filter((s) => bucketOf(s).rank === 4);

    const sum = $("live-sum");
    sum.replaceChildren();
    for (const [key, b] of Object.entries(BUCKETS)) {
      const n = scoped.filter((s) => bucketOf(s) === b).length;
      if (!n) continue;
      sum.append(stateChip(b, `${b.name} ${n}`));
    }

    const box = $("sessions");
    const shown = showQuiet ? [...active, ...quiet] : [...active, ...quiet.slice(0, Math.max(0, QUIET_LIMIT - active.length))];
    box.replaceChildren(...shown.map(sessionCard));
    const hiddenCount = scoped.length - shown.length;
    if (!scoped.length) setLiveMsg(scopeAll ? "セッションがありません。" : "pipe-in のセッションはありません（「すべて」で、ほかのリポジトリも見られます）。");
    else if (hiddenCount > 0 || showQuiet) {
      setLiveMsg("", false);
      const m = $("live-msg"); m.hidden = false;
      const b = el("button", "linkbtn", showQuiet ? "一区切りのセッションを減らす" : `一区切りのセッションをあと ${hiddenCount} 件出す`);
      b.type = "button";
      b.addEventListener("click", () => { showQuiet = !showQuiet; renderSessions(); });
      m.append(b);
    } else setLiveMsg("");
    fillSessionSelect();
    renderBoard();
  }

  function sessionCard(s) {
    const b = bucketOf(s);
    const card = el("article", "sess " + b.cls);
    const r1 = el("div", "row1");
    r1.append(el("span", "title", s.title || "(題なし)"), stateChip(b, b.name));
    card.append(r1);
    const sm = summaryOf(s);
    if (sm.need) card.append(el("div", "detail need", "要ること：" + sm.need));
    else if (sm.detail) card.append(el("div", "detail", sm.detail));
    const meta = el("div", "meta");
    const br = branchOf(s);
    if (br) meta.append(el("span", "pill mono", br));
    if (scopeAll) {
      const repos = ((s.session_context || {}).outcomes || []).map((o) => o && o.git_repository && o.git_repository.git_info && o.git_repository.git_info.repo).filter(Boolean);
      if (repos.length) meta.append(el("span", "pill mono", repos.join(", ")));
    }
    const cost = s.external_metadata && s.external_metadata.usage && s.external_metadata.usage.cost_usd;
    if (typeof cost === "number") meta.append(el("span", "pill mono", "$" + cost.toFixed(2)));
    const linked = items.filter((it) => it.session === s.id);
    if (linked.length) meta.append(el("span", "pill", "ボードの項目 " + linked.length));
    if (meta.childNodes.length) card.append(meta);
    const foot = el("div", "foot");
    foot.append(el("span", "grow", ago(s.updated_at) ? "更新 " + ago(s.updated_at) : ""));
    if (canWrite && col) {
      const add = el("button", "linkbtn", "ボードに足す");
      add.type = "button";
      add.addEventListener("click", () => openEdit(null, { title: s.title || "", status: "doing", session: s.id }));
      foot.append(add);
    }
    if (/^session_[A-Za-z0-9]+$/.test(s.id)) {
      const a = el("a", null, "開く");
      a.href = SESSION_URL + s.id; a.target = "_blank"; a.rel = "noopener";
      foot.append(a);
    }
    card.append(foot);
    return card;
  }

  function fillSessionSelect() {
    const sel = $("f-session");
    const keep = sel.value;
    const opts = [{ id: "", name: "つながない" }];
    for (const s of sessions) {
      if (String(s.session_status || "").includes("ARCHIVED")) continue;
      opts.push({ id: s.id, name: `${s.title || s.id}（${bucketOf(s).name}）` });
    }
    if (editing && editing.session && !sessionsById.has(editing.session)) opts.push({ id: editing.session, name: "前につないだセッション（一覧に無い）" });
    fill(sel, opts);
    sel.value = opts.some((o) => o.id === keep) ? keep : "";
  }

  for (const [id, all] of [["scope-repo", false], ["scope-all", true]]) {
    $(id).addEventListener("click", () => {
      scopeAll = all; remember();
      $("scope-repo").setAttribute("aria-pressed", String(!scopeAll));
      $("scope-all").setAttribute("aria-pressed", String(scopeAll));
      renderSessions();
    });
  }
  $("scope-repo").setAttribute("aria-pressed", String(!scopeAll));
  $("scope-all").setAttribute("aria-pressed", String(scopeAll));

  let mcp = null, unwatch = null;
  const LIST_INPUT = { mine: true, limit: 40 };

  function onSessions(result) {
    const list = extractSessions(result && result.payload);
    if (!list) { setLiveMsg("セッションの一覧の形が読めませんでした。", true); return; }
    sessions = list;
    sessionsLoaded = true;
    const at = result.cache && result.cache.storedAt ? new Date(result.cache.storedAt) : new Date();
    $("live-stamp").textContent = at.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) + " 時点";
    $("live-refresh").hidden = false;
    renderSessions();
  }

  function onSessionError(e) {
    const code = e && e.code;
    const retract = () => { sessions = []; $("sessions").replaceChildren(); $("live-sum").replaceChildren(); };
    if (code === "approval_required" || code === "not_in_manifest" || code === "consent_required") {
      retract();
      setLiveMsg("セッションを見るには、このページに Claude Code Remote を使う許しが要ります。", false, { label: "許して表示する", run: askOnce });
    } else if (code === "needs_reauth") {
      retract(); setLiveMsg("Claude Code Remote のつながりが切れています。claude.ai の設定 → コネクタでつなぎ直してください。", true);
    } else if (code === "server_not_connected" || code === "selection_required") {
      retract(); setLiveMsg("この画面では Claude Code Remote が使えません（claude.ai で開くと見られます）。", true);
    } else if (code === "blocked_by_policy") {
      retract(); setLiveMsg("組織の決まりで、セッションの一覧は読めません。", true);
    } else if (code === "server_unavailable" || code === "rate_limited") {
      setLiveMsg(sessions.length ? "読み直しに失敗しました。前の一覧のままです。" : "セッションを読めませんでした。少し待ってから「読み直す」を押してください。", true);
      $("live-refresh").hidden = false;
    } else if (code === "tool_error") {
      setLiveMsg("セッションの一覧を読めませんでした（" + String(e.message || "").slice(0, 120) + "）", true);
    } else {
      setLiveMsg("セッションを読めませんでした。「読み直す」を押してください。", true);
      $("live-refresh").hidden = false;
    }
  }

  function startWatch() {
    if (!mcp || unwatch) return;
    unwatch = mcp.watchTool(SESSION_SERVER, "list_sessions", LIST_INPUT, (ev) => {
      if (ev.type === "data") onSessions(ev.result);
      else onSessionError(ev.error);
    }, { refetchInterval: 30000 });
  }

  async function askOnce() {
    if (!mcp) return;
    setLiveMsg("確認しています…");
    try {
      const r = await mcp.callTool(SESSION_SERVER, "list_sessions", LIST_INPUT, { cache: { staleTime: 0, gcTime: 300000 } });
      onSessions(r);
      if (unwatch) { unwatch(); unwatch = null; }
      startWatch();
    } catch (e) { onSessionError(e); }
  }

  $("live-refresh").addEventListener("click", async () => {
    if (!mcp) return;
    uncertain.clear(); renderBoard();
    try { await mcp.invalidate(SESSION_SERVER, "list_sessions"); } catch (e) {}
    askOnce();
  });

  // ---- ボード ----
  function matches(it) {
    if (filterKind && it.kind !== filterKind) return false;
    if (!query) return true;
    const q = query.toLowerCase();
    const s = it.session && sessionsById.get(it.session);
    const hay = [it.title, it.note, it.decision, it.issue ? "#" + it.issue : "", s ? s.title : ""].join(" ").toLowerCase();
    return hay.includes(q);
  }

  function renderStages() {
    const box = $("stages");
    box.replaceChildren(...STAGES.map((s) => {
      const list = items.filter((it) => (it.stage || "x") === s.id);
      const done = list.filter((it) => it.status === "done").length;
      const b = el("button", "stage");
      b.type = "button";
      b.setAttribute("aria-pressed", String(filterStage === s.id));
      const top = el("div", "top");
      const left = el("div");
      left.append(el("div", "num", s.id === "x" ? "OTHER" : `STAGE ${s.id}`), el("div", "name", s.name));
      top.append(left, el("span", "frac", `${done}/${list.length}`));
      const bar = el("div", "bar");
      bar.setAttribute("aria-hidden", "true");
      for (const st of ["done", "check", "doing"]) {
        const n = list.filter((it) => it.status === st).length;
        if (!n) continue;
        const seg = el("span", "g-" + st);
        seg.style.width = (n / list.length * 100) + "%";
        bar.append(seg);
      }
      b.append(top, bar, el("div", "sub", s.sub));
      b.title = STATUSES.map((st) => `${st.name} ${list.filter((it) => it.status === st.id).length}`).join(" / ");
      b.addEventListener("click", () => { filterStage = filterStage === s.id ? null : s.id; remember(); render(); });
      return b;
    }));
  }

  function renderKinds() {
    const box = $("kinds");
    const all = [{ id: null, name: "すべて" }, ...KINDS];
    box.replaceChildren(...all.map((k) => {
      const c = el("button", "chip", k.name);
      c.type = "button";
      c.setAttribute("aria-pressed", String(filterKind === k.id));
      c.addEventListener("click", () => { filterKind = k.id; remember(); render(); });
      return c;
    }));
  }

  function card(it) {
    const c = el("article", "card");
    c.tabIndex = 0;
    c.setAttribute("role", "button");
    c.setAttribute("aria-label", (it.title || "") + "（押すと変えられます）");
    const head = el("div", "head");
    head.append(el("div", "t", it.title || "(名前なし)"));
    if (it.priority) {
      const pr = el("span", "prio p-" + it.priority);
      pr.setAttribute("role", "img"); pr.setAttribute("aria-label", "優先 " + nameOf(PRIOS, it.priority));
      pr.append(el("i"), el("i"), el("i"));
      head.append(pr);
    }
    c.append(head);
    const meta = el("div", "meta");
    const st = it.stage || "x";
    meta.append(el("span", "pill", st === "x" ? "段階外" : `段階${st}`));
    meta.append(el("span", "pill", nameOf(KINDS, it.kind)));
    if (it.issue) meta.append(el("span", "pill mono", "#" + it.issue));
    if (it.decision) meta.append(el("span", "pill mono", it.decision));
    if (it.session) {
      const s = sessionsById.get(it.session);
      if (s) {
        const b = bucketOf(s);
        const chip = stateChip(b, "セッション " + b.name);
        chip.title = s.title || "";
        meta.append(chip);
      } else meta.append(el("span", "pill", "セッションあり"));
    }
    c.append(meta);
    if (it.note) c.append(el("div", "note", it.note));
    if (canWrite && col) {
      const i = STATUS_IDS.indexOf(it.status);
      const acts = el("div", "acts");
      if (canRun(it)) {
        const run = el("button", "mv run", "実行");
        run.type = "button";
        if (uncertain.has(it.id)) { run.disabled = true; run.title = "セッションを読み直して確かめてから"; }
        run.addEventListener("click", (ev) => { ev.stopPropagation(); openRun(it); });
        run.addEventListener("keydown", (ev) => ev.stopPropagation());
        acts.append(run);
      }
      if (i > 0) acts.append(moveButton(it, STATUS_IDS[i - 1], "← " + STATUSES[i - 1].name));
      if (i >= 0 && i < STATUS_IDS.length - 1) acts.append(moveButton(it, STATUS_IDS[i + 1], STATUSES[i + 1].name + " →"));
      c.append(acts);
      c.draggable = true;
      c.addEventListener("dragstart", (ev) => { dragId = it.id; c.classList.add("dragging"); try { ev.dataTransfer.setData("text/plain", it.id); ev.dataTransfer.effectAllowed = "move"; } catch (e) {} });
      c.addEventListener("dragend", () => { dragId = null; c.classList.remove("dragging"); document.querySelectorAll(".col.drop").forEach((x) => x.classList.remove("drop")); });
    }
    c.addEventListener("click", () => openEdit(it));
    c.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openEdit(it); } });
    return c;
  }

  function moveButton(it, to, label) {
    const b = el("button", "mv", label);
    b.type = "button";
    b.addEventListener("click", (ev) => { ev.stopPropagation(); moveItem(it.id, to); });
    return b;
  }

  // 状態だけを書き換える。戻せるように前の状態を覚えておく。
  let toastTimer = null, lastMove = null;
  async function moveItem(id, to) {
    const it = items.find((x) => x.id === id);
    if (!it || !col || it.status === to) return;
    const from = it.status;
    try {
      await col.doc(id).update({ status: to, updatedAt: new Date().toISOString() });
      lastMove = { id, from };
      showToast(`「${(it.title || "").slice(0, 30)}」を${nameOf(STATUSES, to)}へ移しました`, true);
    } catch (e) { writeError(e); }
  }
  function showToast(text, undoable) {
    $("toast-text").textContent = text;
    $("toast-undo").hidden = !undoable;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").hidden = true; lastMove = null; }, 6000);
  }
  $("toast-undo").addEventListener("click", async () => {
    const m = lastMove; lastMove = null; $("toast").hidden = true;
    if (!m || !col) return;
    try { await col.doc(m.id).update({ status: m.from, updatedAt: new Date().toISOString() }); } catch (e) { writeError(e); }
  });

  function renderBoard() {
    const visible = items.filter((it) => (!filterStage || (it.stage || "x") === filterStage) && matches(it));
    const board = $("board");
    board.replaceChildren(...STATUSES.map((s) => {
      const column = el("section", "col");
      column.setAttribute("aria-label", s.name);
      let list = visible.filter((it) => it.status === s.id);
      list.sort((a, b) => s.id === "done"
        ? String(b.updatedAt || "").localeCompare(String(a.updatedAt || ""))
        : (prioRank[a.priority || ""] - prioRank[b.priority || ""]) || String(a.stage || "x").localeCompare(String(b.stage || "x")) || (a.issue || 9999) - (b.issue || 9999));
      const h = el("h2");
      const ic = icon(s.icon); ic.style.color = `var(${s.color})`;
      h.append(ic, document.createTextNode(s.name), el("span", "count", String(list.length)));
      column.append(h, el("p", "hint", s.hint));
      if (!list.length) column.append(el("div", "empty", canWrite && col ? "ここへ引いて移せます" : "ありません"));
      const shown = s.id === "done" && !showAllDone ? list.slice(0, DONE_LIMIT) : list;
      for (const it of shown) column.append(card(it));
      if (s.id === "done" && list.length > DONE_LIMIT) {
        const m = el("button", "more", showAllDone ? "新しい順に8件だけ出す" : `残り ${list.length - DONE_LIMIT} 件も出す`);
        m.type = "button";
        m.addEventListener("click", () => { showAllDone = !showAllDone; renderBoard(); });
        column.append(m);
      }
      column.addEventListener("dragover", (ev) => { if (!dragId) return; ev.preventDefault(); column.classList.add("drop"); });
      column.addEventListener("dragleave", (ev) => { if (!column.contains(ev.relatedTarget)) column.classList.remove("drop"); });
      column.addEventListener("drop", (ev) => { ev.preventDefault(); column.classList.remove("drop"); const id = dragId; dragId = null; if (id) moveItem(id, s.id); });
      return column;
    }));
  }

  function render() { renderStages(); renderKinds(); renderBoard(); }

  function setSync(text, err) { const s = $("sync"); s.textContent = text; s.classList.toggle("err", !!err); }
  function writeError(e) {
    if (e && e.code === "invalid_argument") { canWrite = false; setSync("この画面では保存できません（見るだけ）", true); render(); }
    else if (e && e.code === "quota_exceeded") setSync("保存できる数の上限です。完了した古い項目を消してください", true);
    else setSync("保存できませんでした。少し待ってからもう一度試してください", true);
  }

  // ---- 編集 ----
  const dlg = $("dlg");
  let delArmed = false;
  function openEdit(it, preset) {
    editing = it || null;
    const v = it || Object.assign({ title: "", status: "idea", stage: filterStage || "x", kind: "idea", priority: "", issue: null, decision: "", note: "", session: "" }, preset || {});
    $("dlg-title").textContent = it ? "項目を変える" : "項目を足す";
    $("f-title").value = v.title || "";
    $("f-status").value = v.status || "idea";
    $("f-stage").value = v.stage || "x";
    $("f-kind").value = v.kind || "idea";
    $("f-priority").value = v.priority || "";
    $("f-issue").value = v.issue || "";
    $("f-decision").value = v.decision || "";
    $("f-note").value = v.note || "";
    $("f-session").value = "";
    fillSessionSelect();
    $("f-session").value = v.session || "";
    const links = $("f-links"); links.replaceChildren();
    if (v.issue) { const a = el("a", null, `イシュー #${v.issue} を開く`); a.href = `${REPO}/issues/${v.issue}`; a.target = "_blank"; a.rel = "noopener"; links.append(a); }
    if (v.decision && /^D\d{4}$/.test(v.decision)) { const a = el("a", null, `${v.decision} を探す`); a.href = `${REPO}/tree/main/docs/decisions`; a.target = "_blank"; a.rel = "noopener"; links.append(a); }
    if (v.session && /^session_[A-Za-z0-9]+$/.test(v.session)) { const a = el("a", null, "セッションを開く"); a.href = SESSION_URL + v.session; a.target = "_blank"; a.rel = "noopener"; links.append(a); }
    $("f-del").hidden = !it || !canWrite;
    $("f-confirm").hidden = true; delArmed = false;
    $("f-save").disabled = !canWrite || !col;
    $("ro-note").hidden = canWrite;
    dlg.showModal();
    $("f-title").focus();
  }
  $("add").addEventListener("click", () => openEdit(null));
  $("f-cancel").addEventListener("click", () => dlg.close());
  $("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (!col || !canWrite) return;
    const issueNum = parseInt($("f-issue").value, 10);
    const body = {
      title: $("f-title").value.trim(),
      status: $("f-status").value,
      stage: $("f-stage").value,
      kind: $("f-kind").value,
      priority: $("f-priority").value,
      issue: Number.isFinite(issueNum) && issueNum > 0 ? issueNum : null,
      decision: $("f-decision").value.trim().toUpperCase() || null,
      session: $("f-session").value || null,
      note: $("f-note").value.trim(),
      updatedAt: new Date().toISOString(),
    };
    if (!body.title) { $("f-title").focus(); return; }
    $("f-save").disabled = true;
    try {
      if (editing) await col.doc(editing.id).set(body);
      else await col.add(body);
      dlg.close();
      showToast(editing ? "保存しました" : "足しました", false);
    } catch (e) { writeError(e); }
    finally { $("f-save").disabled = !canWrite; }
  });
  $("f-del").addEventListener("click", async () => {
    if (!editing || !col) return;
    if (!delArmed) { delArmed = true; $("f-confirm").hidden = false; return; }
    try { await col.doc(editing.id).delete(); dlg.close(); showToast("消しました", false); }
    catch (e) { writeError(e); }
  });

  const runDlg = $("run-dlg");
  function isRunning(sid) {
    const s = sessionsById.get(sid);
    if (!s) return justStarted.has(sid);
    if (String(s.session_status || "").includes("ARCHIVED")) return false;
    const raw = String(s.status_bucket || "").replace("SESSION_STATUS_BUCKET_", "");
    return raw !== "COMPLETED" && raw !== "FAILED";
  }
  function canRun(it) {
    return !!(canWrite && col && mcp && (it.title || "").trim() && (!it.session || (sessionsLoaded && !isRunning(it.session))));
  }
  function buildPrompt(it) {
    const title = (it.title || "").trim();
    const note = (it.note || "").trim();
    return "/pipe-in " + title + (note ? "\n\n" + note : "");
  }
  function promptOk(text) {
    return typeof text === "string" && text.startsWith("/pipe-in ") && text.slice(9).trim().length > 0;
  }
  function readJsonText(payload) {
    if (typeof payload !== "string") return payload;
    const a = payload.indexOf("{"), b = payload.lastIndexOf("}");
    try { return a >= 0 && b > a ? JSON.parse(payload.slice(a, b + 1)) : null; } catch (e) { return null; }
  }
  function extractEnvironments(payload) {
    const p = readJsonText(payload);
    const list = (p && p.environments) || (p && p.ccr && p.ccr.data) || (p && p.data) || (Array.isArray(p) ? p : null);
    if (!Array.isArray(list)) return null;
    return list.filter((e) => e && typeof e.environment_id === "string" && e.state === "active");
  }
  function extractSessionId(payload) {
    const p = readJsonText(payload);
    const ok = (c) => typeof c === "string" && /^session_[A-Za-z0-9]+$/.test(c);
    if (ok(p)) return p;
    if (!p || typeof p !== "object") return "";
    // 実際の返事は ccr の中に id が入る形（D0042 の実機で確かめた）。
    for (const c of [p.ccr && p.ccr.id, p.id, p.session_id, p.session && p.session.id]) if (ok(c)) return c;
    return "";
  }
  function pickEnvironment(list, saved) {
    if (saved && list.some((e) => e.environment_id === saved)) return { id: saved, lost: false };
    if (list.length === 1) return { id: list[0].environment_id, lost: !!saved };
    return { id: "", lost: !!saved };
  }
  function setRunMsg(text, sid) {
    $("run-msg").textContent = text;
    const m = $("run-msg");
    if (sid && /^session_[A-Za-z0-9]+$/.test(sid)) {
      const a = el("a", null, "開く");
      a.href = SESSION_URL + sid; a.target = "_blank"; a.rel = "noopener";
      m.append(" ", a);
    }
    m.hidden = !text;
  }
  function syncGo() {
    $("run-go").disabled = creating || runBlocked || !envs.length || !runItem || uncertain.has(runItem.id);
    $("run-cancel").disabled = creating;
  }
  function runError(e, reading) {
    const code = e && e.code;
    const unsure = () => { if (runItem) uncertain.add(runItem.id); renderBoard(); };
    let text;
    if (code === "not_in_manifest") {
      runBlocked = true;
      text = "このボードは古い宣言のまま公開されています。ボードを公開し直す必要があります（Claude Code で `/pipe-plan` を開くと勧めます）";
    } else if (code === "approval_required" || code === "consent_required") {
      text = reading
        ? "環境を読むには、このページに許しが要ります。「許して読む」を押してください。断った場合、セッションは作られません"
        : "このページに、セッションを作る許しが要ります。許しの画面で許してから、もう一度「作る」を押してください。許されなければセッションは作られていません";
      $("run-allow").hidden = !reading;
    } else if (code === "blocked_by_policy") {
      text = "組織の決まりで作れません。セッションは作られていません";
    } else if (code === "needs_reauth") {
      text = "Claude Code Remote のつながりが切れています。claude.ai の設定 → コネクタでつなぎ直してください";
    } else if (code === "server_not_connected" || code === "selection_required") {
      text = "この画面では Claude Code Remote が使えません";
    } else if (code === "tool_error") {
      text = (reading ? "環境を読めませんでした（" : "作れませんでした（") + String(e.message || "").slice(0, 120) + "）";
    } else if (reading) {
      text = "環境を読めませんでした。少し待ってから、もう一度開いてください";
    } else if (code === "no_session_id") {
      text = "セッションは作られたかもしれませんが、返事から ID を読めませんでした。一覧を読み直して確かめてください";
      unsure();
    } else {
      text = "結果が分かりません。作られたかもしれません。「読み直す」で一覧を確かめてから、もう一度押してください";
      unsure();
    }
    setRunMsg(text);
  }
  async function loadEnvironments() {
    const seq = ++envSeq;
    const sel = $("run-env");
    envs = []; runBlocked = false;
    sel.replaceChildren();
    $("run-allow").hidden = true;
    $("run-env-note").textContent = "環境を読んでいます…";
    syncGo();
    try {
      const r = await mcp.callTool(SESSION_SERVER, "list_environments", {}, { cache: { staleTime: 0, gcTime: 300000 } });
      if (seq !== envSeq) return;
      const list = extractEnvironments(r && r.payload);
      if (!list) { $("run-env-note").textContent = "環境の一覧の形が読めませんでした"; return; }
      if (!list.length) { $("run-env-note").textContent = "使える環境がありません"; return; }
      envs = list;
      const pick = pickEnvironment(list, savedEnvId);
      const opts = list.map((e) => { const op = el("option", null, e.name || e.environment_id); op.value = e.environment_id; return op; });
      if (!pick.id) { const ph = el("option", null, "選んでください"); ph.value = ""; opts.unshift(ph); }
      sel.replaceChildren(...opts);
      sel.value = pick.id;
      let note = "";
      if (pick.lost) note = "前に選んだ環境が見つかりません。" + (pick.id ? "環境が 1 つなので自動で選びました" : "選び直してください");
      else if (list.length === 1) note = "環境が 1 つなので自動で選びました";
      else if (!pick.id) note = "使う環境を選んでください";
      $("run-env-note").textContent = note;
    } catch (e) {
      if (seq !== envSeq) return;
      envs = [];
      $("run-env-note").textContent = "";
      runError(e, true);
    } finally {
      if (seq === envSeq) syncGo();
    }
  }
  function openRun(it) {
    if (creating) return;
    runItem = it;
    $("run-prompt").value = buildPrompt(it);
    setRunMsg("");
    runDlg.showModal();
    loadEnvironments();
  }
  async function createSession(item, prompt, envId) {
    if (!promptOk(prompt)) return "";
    if (!envId) return "";
    if (!mcp || !col) return "";
    const r = await mcp.callTool(SESSION_SERVER, "create_session", {
      prompt,
      source_url: REPO,
      environment_id: envId,
      title: item.title.trim().slice(0, 200),
    });
    const id = extractSessionId(r && r.payload);
    if (!id) { const err = new Error("返事から ID を読めない"); err.code = "no_session_id"; throw err; }
    try {
      await col.doc(item.id).update({ session: id, updatedAt: new Date().toISOString() });
    } catch (e) {
      const err = new Error("カードに書けない"); err.code = "card_write_failed"; err.sessionId = id; throw err;
    }
    return id;
  }
  async function rememberEnv(envId) {
    if (!db || !envId || envId === savedEnvId) return;
    try {
      await db.collection("settings").doc("run").set({ environmentId: envId, updatedAt: new Date().toISOString() });
      savedEnvId = envId;
    } catch (e) {}
  }
  $("run-cancel").addEventListener("click", () => { if (!creating) runDlg.close(); });
  $("run-allow").addEventListener("click", () => loadEnvironments());
  runDlg.addEventListener("cancel", (ev) => { if (creating) ev.preventDefault(); });
  $("run-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (creating || !runItem) return;
    const item = runItem;
    const prompt = $("run-prompt").value;
    const envId = $("run-env").value;
    if (!promptOk(prompt)) { setRunMsg("先頭は「/pipe-in 」にしてください（その後ろに内容も要ります）"); return; }
    if (!envId) { setRunMsg("環境を選んでください"); return; }
    creating = true;
    $("run-go").disabled = true;
    $("run-cancel").disabled = true;
    setRunMsg("");
    try {
      const id = await createSession(item, prompt, envId);
      if (!id) return;
      justStarted.add(id);
      rememberEnv(envId);
      runDlg.close();
      showToast("セッションを作りました", false);
      try { await mcp.invalidate(SESSION_SERVER, "list_sessions"); } catch (e) {}
      askOnce();
    } catch (e) {
      if (e && e.code === "card_write_failed") {
        justStarted.add(e.sessionId);
        rememberEnv(envId);
        setRunMsg("セッションは作れましたが、カードに書けませんでした。ID：" + e.sessionId, e.sessionId);
      } else runError(e, false);
    } finally {
      creating = false;
      syncGo();
    }
  });

  $("q").addEventListener("input", (ev) => { query = ev.target.value.trim(); renderBoard(); });
  document.addEventListener("keydown", (ev) => {
    if (dlg.open || runDlg.open || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (ev.key === "Escape") document.activeElement.blur(); return; }
    if (ev.key === "/") { ev.preventDefault(); $("q").focus(); }
    else if ((ev.key === "n" || ev.key === "N") && canWrite && col) { ev.preventDefault(); openEdit(null); }
  });

  render();

  (async () => {
    db = await window.claude?.use?.("db");
    if (!db) { setSync("データを読めません（サインインして開いてください）", true); $("add").disabled = true; return; }
    try {
      const user = await window.claude.use("user");
      const w = user ? await user.can("data.write") : null;
      if (w === false) { canWrite = false; $("add").disabled = true; }
    } catch (e) {}
    col = db.collection("items");
    col.onSnapshot((snap) => {
      items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      setSync(items.length ? `${items.length} 件` : "まだ項目がありません。「＋ 足す」から入れます");
      render();
      if (sessions.length) renderSessions();
    }, () => setSync("読み込みが止まりました。開き直してください", true));
    try {
      db.collection("settings").onSnapshot((snap) => {
        const d = snap.docs.find((x) => x.id === "run");
        const v = d ? d.data().environmentId : "";
        savedEnvId = typeof v === "string" ? v : "";
      }, () => {});
    } catch (e) {}
  })();

  (async () => {
    mcp = await window.claude?.use?.("mcp");
    if (!mcp) { setLiveMsg("このページではセッションを読めません（claude.ai で開くと見られます）。"); return; }
    renderBoard();
    let state = "prompt";
    try {
      const perms = await window.claude.use("permissions");
      if (perms) state = await perms.state("mcp:" + SESSION_SERVER).catch(() => "unavailable");
    } catch (e) {}
    if (state === "granted") startWatch();
    else if (state === "denied") setLiveMsg("Claude Code Remote を使う許しが切られています。アーティファクトの「権限」から入れ直せます。");
    else setLiveMsg("セッションの様子を、Claude Code Remote から読んで出せます。", false, { label: "セッションを表示する", run: askOnce });
  })();
})();
</script>
