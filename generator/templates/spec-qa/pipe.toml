# pipe-in のパイプ：仕様書とソースを突き合わせ、食い違い・検討事項・QA の観点とテストケース案を作る
#
# どの段もコードやテストは書きません（読むだけで、文書を書きます）。
# 依頼メモに、仕様書の場所と、見てほしい範囲を書いて流してください。

[pipe]
kind = "linear"
label = "仕様とソースの突き合わせ（検討事項・QA）"
description = "仕様の項目とソースの対応を取り、食い違いと検討事項を洗い出し、QA の観点とテストケース案を書く"
input = "required"  # 仕様書の場所と、見てほしい範囲

[[stages]]
name = "trace"
label = "仕様とソースの対応"
output = "01_trace.md"
access = "read"
prompt_file = "prompts/01_trace.md"

[[stages]]
name = "gaps"
label = "食い違いと検討事項"
output = "02_gaps.md"
access = "read"
review = true
prompt_file = "prompts/02_gaps.md"

[[stages]]
name = "qa"
label = "QA の観点とテストケース"
output = "03_qa.md"
access = "read"
review = true
prompt_file = "prompts/03_qa.md"
